name = "leetgit"
main = "index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[vars]
APP_ORIGIN = "https://leetgit.example.workers.dev"
GITHUB_APP_SLUG = "your-github-app-slug"
GITHUB_CLIENT_ID = "replace-with-your-client-id"
EXTENSION_IDS = "replace-with-your-chrome-extension-id"

[[d1_databases]]
binding = "DB"
database_name = "leetgit"
database_id = "00000000-0000-0000-0000-000000000000"

[triggers]
crons = ["15 3 * * *"]
